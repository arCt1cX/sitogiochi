<head>

    <link rel="apple-touch-icon" sizes="180x180" href="../app-icon.png">

    <!-- Open Graph / Facebook Meta Tags (English for international SEO) -->

        content="DrewGames: a collection of fun party games to play with friends offline. Discover interactive games like Impostor, ColorGrid, GuessThePic and many more!">
    <meta property="og:image" content="https://www.partygamesdrew.com/logo-mrdrew.jpg">

    <!-- Twitter Meta Tags (English for SEO) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://www.partygamesdrew.com/en/">
    <meta name="twitter:title" content="DrewGames - Party Games to Play with Friends Offline">
    <meta name="twitter:description"
        content="DrewGames: a collection of fun party games to play with friends offline. Discover interactive games like Impostor, ColorGrid, GuessThePic and many more!">
    <meta name="twitter:image" content="https://www.partygamesdrew.com/logo-mrdrew.jpg">

    <!-- Hreflang tags for language alternatives - English version -->
    <link rel="alternate" hreflang="en" href="https://www.partygamesdrew.com/en/" />
    <link rel="alternate" hreflang="it" href="https://www.partygamesdrew.com/" />
    <link rel="alternate" hreflang="x-default" href="https://www.partygamesdrew.com/" />

    <meta name="robots" content="index, follow">
    <meta name="content-language" content="en" />

    <meta name="keywords"
        content="party games, offline games, games with friends, drinking games, social games, multiplayer games">

    <!-- JSON-LD structured data for better search results (English) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DrewGames",
      "url": "https://www.partygamesdrew.com/en/",
      "inLanguage": "en-US",
      "description": "A collection of fun party games to play with friends offline. Discover interactive games like Impostor, ColorGrid, GuessThePic and many more!",
      "logo": "https://www.partygamesdrew.com/logo-mrdrew.jpg",
      "image": "https://www.partygamesdrew.com/logo-mrdrew.jpg"
    }
    </script>

    <!-- Redirect to main page with English language parameter -->
    <script>
        // Set language preference BEFORE redirect
        try {
            localStorage.setItem('lang', 'en');
            console.log('Language set to English');
        } catch (e) {
            console.warn('Could not set localStorage:', e);
        }
        // Small delay to ensure localStorage is persisted, then redirect
        setTimeout(function () {
            window.location.replace('/?lang=en');
        }, 50);
    </script>

    <!-- Fallback for users without JavaScript -->
    <noscript>
        <meta http-equiv="refresh" content="0; url=https://www.partygamesdrew.com/?lang=en">
    </noscript>
</head>

<body>
    <p>Redirecting to <a href="https://www.partygamesdrew.com/?lang=en">DrewGames (English)</a>...</p>
