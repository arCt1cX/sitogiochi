<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0810">
    <!-- Dynamic meta tags based on browser language -->
    <script>
        // Run this before other meta tags
        const preferredLang = navigator.language || navigator.userLanguage;
        const isItalian = preferredLang && (preferredLang.startsWith('it') || preferredLang === 'it');

        if (isItalian) {
            document.write('<title>Hot Takes - Gioco di opinioni controverse | DrewGames</title>');
            document.write('<meta name="description" content="Hot Takes: il gioco dove devi esprimere le tue opinioni più controverse su vari argomenti. Scopri chi ha detto cosa!">');
        } else {
            document.write('<title>Hot Takes - Game of controversial opinions | DrewGames</title>');
            document.write('<meta name="description" content="Hot Takes: the game where you have to express your most controversial opinions on various topics. Find out who said what! ">');
        }
    </script>
    <!-- Hreflang tags for language alternatives -->
    <link rel="alternate" hreflang="en" href="https://www.partygamesdrew.com/hottakes/?lang=en" />
    <link rel="alternate" hreflang="it" href="https://www.partygamesdrew.com/hottakes/?lang=it" />
    <link rel="alternate" hreflang="x-default" href="https://www.partygamesdrew.com/hottakes/" />

    <!-- Google Tag Manager -->
    <script>(function (w, d, s, l, i) {
            w[l] = w[l] || []; w[l].push({
                'gtm.start':
                    new Date().getTime(), event: 'gtm.js'
            }); var f = d.getElementsByTagName(s)[0],
                j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
                    'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-5KN33WJ3');</script>
    <!-- End Google Tag Manager -->

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1877136537382240"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="../dg-ui.css">
    <link rel="stylesheet" href="styles.css">
    <script src="../js/tournament-button.js" defer></script>
</head>

<body data-game-id="hottakes">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5KN33WJ3" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <button class="home-button" onclick="window.location.href='../'">
        <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Home</span>
    </button>

    <div class="container">
        <!-- Setup Screen -->
        <div id="setup-screen" class="screen active">
            <div class="game-header">
                <h1>Hot Takes</h1>
                <p class="subtitle">Esprimi la tua opinione controversa!</p>
            </div>

            <div class="setup-form">
                <div class="form-group">
                    <label for="player-count">Numero di Giocatori:</label>
                    <select id="player-count">
                        <option value="3" selected>3 Giocatori</option>
                        <option value="4">4 Giocatori</option>
                        <option value="5">5 Giocatori</option>
                        <option value="6">6 Giocatori</option>
                        <option value="7">7 Giocatori</option>
                        <option value="8">8 Giocatori</option>
                        <option value="9">9 Giocatori</option>
                        <option value="10">10 Giocatori</option>
                    </select>
                </div>

                <div id="player-names-container">
                    <!-- Player name inputs will be generated here -->
                </div>

                <button id="start-game" class="btn primary-btn">Inizia il Gioco! </button>
            </div>
        </div>

        <!-- Input Screen -->
        <div id="input-screen" class="screen">
            <div class="game-header">
                <h2>Categoria:</h2>
                <div class="category-container">
                    <h1 id="current-category" class="category-display">...</h1>
                    <button id="reroll-category" class="btn-icon" title="Cambia categoria" aria-label="Cambia categoria">
                        <svg viewBox="0 0 24 24"><path d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 01-9.58 2H5.29A7 7 0 1012 6z"/></svg>
                    </button>
                </div>
            </div>

            <div class="player-turn-info">
                <p>Turno di: <span id="current-player-name" class="highlight-name">Giocatore 1</span></p>
                <p class="instruction">Passa il telefono a questo giocatore!</p>
            </div>

            <div id="input-area" class="input-area" style="display: none;">
                <p class="prompt">Scrivi la tua Hot Take su questo argomento:</p>
                <textarea id="hot-take-input" placeholder="Es: Secondo me..." rows="4" maxlength="150"></textarea>
                <button id="submit-take" class="btn primary-btn">Invia </button>
            </div>

            <button id="reveal-input" class="btn secondary-btn">Sono pronto!</button>
        </div>

        <!-- Reveal Screen -->
        <div id="reveal-screen" class="screen">
            <div class="game-header">
                <h1>Hot Take Estratta</h1>
                <p class="subtitle">Di chi sarà?</p>
            </div>

            <div class="hot-take-card">
                <p id="revealed-take" class="take-text">...</p>
            </div>

            <div class="reveal-controls">
                <button id="reveal-author" class="btn secondary-btn">Svela Autore</button>
                <p id="author-display" class="author-display" style="display: none;">È di: <span
                        id="author-name">...</span></p>
                <button id="next-round" class="btn primary-btn">Prossimo Round</button>
            </div>
        </div>
    </div>

    <script src="../lang.js"></script>
    <script src="translations.js"></script>
    <script src="script.js"></script>
</body>

</html>
