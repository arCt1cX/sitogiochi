<html>

            document.write('<title>Non ho mai - Il classico gioco alcolico | DrewGames</title>');
            document.write('<meta name="description" content="Gioca a Non ho mai: il classico gioco per bere con gli amici! Scopri i segreti dei tuoi amici con centinaia di domande.">');
        } else {
            document.write('<title>Never Have I Ever - The classic drinking game | DrewGames</title>');
            document.write('<meta name="description" content="Play Never Have I Ever: the classic drinking game with friends! Discover your friends\' secrets with hundreds of questions.">');
        }
    </script>
    <!-- Hreflang tags for language alternatives -->
    <link rel="alternate" hreflang="en" href="https://www.partygamesdrew.com/nonhomai/?lang=en" />
    <link rel="alternate" hreflang="it" href="https://www.partygamesdrew.com/nonhomai/?lang=it" />
    <link rel="alternate" hreflang="x-default" href="https://www.partygamesdrew.com/nonhomai/" />

    <link rel="stylesheet" href="../dg-ui.css">
    <link rel="stylesheet" href="styles.css">
    <script src="../js/tournament-button.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="canonical" href="https://www.partygamesdrew.com/nonhomai/">
    <meta name="robots" content="index, follow">
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1877136537382240"
        crossorigin="anonymous"></script>
    <style>
        .question-card {
            background: linear-gradient(180deg, var(--surface2), #140e22);
            padding: 30px;
            border-radius: 22px;
            box-shadow: 0 20px 40px -22px #000;
            text-align: center;
            margin: 20px 0;
            border: 1px solid var(--line);
            border-top: 4px solid var(--violet);
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question-text {
            font-family: var(--disp);
            font-size: 1.5rem;
            color: #fff;
            font-weight: 800;
            line-height: 1.25;
        }

        .question-counter {
            color: var(--muted);
            margin-bottom: 10px;
            font-size: 1rem;
        }

        /* 3-button layout */
        .answer-buttons {
            display: flex;
            flex-direction: column;
            gap: 13px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .answer-btn {
            width: 100%;
            padding: 16px;
            font-family: var(--disp);
            font-size: 1.1rem;
            border-radius: 14px;
            border: 1px solid #33274c;
            cursor: pointer;
            transition: transform 0.18s, filter 0.18s, background 0.18s, border-color 0.18s;
            font-weight: 800;
            letter-spacing: .6px;
            color: #fff;
            text-transform: uppercase;
            background: var(--surface);
            box-shadow: 0 8px 18px -10px #000;
        }

        .answer-btn:hover { transform: translateY(-2px); }
        .answer-btn:active { transform: scale(0.98); }

        .btn-everyone {
            background: rgba(226, 96, 122, 0.16);
            border-color: rgba(226, 96, 122, 0.55);
            color: #ffd0d8;
        }
        .btn-everyone:hover { background: rgba(226, 96, 122, 0.26); }

        .btn-someone {
            background: rgba(244, 165, 43, 0.16);
            border-color: rgba(244, 165, 43, 0.55);
            color: #ffe0b0;
        }
        .btn-someone:hover { background: rgba(244, 165, 43, 0.26); }

        .btn-no-one {
            background: rgba(155, 225, 77, 0.16);
            border-color: rgba(155, 225, 77, 0.55);
            color: #dcf3b8;
        }
        .btn-no-one:hover { background: rgba(155, 225, 77, 0.26); }

        .result-message {
            font-family: var(--disp);
            font-size: 1.4rem;
            color: #fff;
            font-weight: 800;
            text-align: center;
            margin-bottom: 15px;
            background: rgba(123, 104, 238, 0.16);
            padding: 16px;
            border-radius: 14px;
            border: 1px solid rgba(123, 104, 238, 0.45);
        }

        .result-stats {
            margin-bottom: 20px;
            color: var(--muted);
            font-size: 0.95rem;
        }
    </style>
</head>

<body data-game-id="nonhomai">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5KN33WJ3" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <button class="home-button" onclick="window.location.href='../'">
        <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span id="homeText">Home</span>
    </button>

    <div class="container">
        <div id="game-title">
            <h1 id="gameTitle">Non ho mai...</h1>
        </div>

        <!-- Setup Screen -->
        <div id="setup-screen" class="game-screen active">
            <h2 id="setupTitle">Impostazioni Partita</h2>
            <div class="form-group">
                <label for="question-count" id="questionCountLabel">Numero di frasi:</label>
                <select id="question-count">
                    <option value="15">15 <span class="questions-text">Frasi</span></option>
                    <option value="20" selected>20 <span class="questions-text">Frasi</span></option>
                    <option value="30">30 <span class="questions-text">Frasi</span></option>
                    <option value="50">50 <span class="questions-text">Frasi</span></option>
                </select>
            </div>
            <button id="start-game" class="btn primary-btn"><span id="startGameText">Inizia Gioco</span></button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="game-screen">
            <div class="question-counter"
                style="text-align: center; color: var(--violet-2); font-weight: bold; font-size: 1.2rem;">
                <span id="current-question">1</span> / <span id="total-questions">20</span>
            </div>

            <div class="question-card">
                <p id="question-display" class="question-text"></p>
            </div>

            <div id="answer-buttons" class="answer-buttons">
                <button id="btn-everyone" class="btn answer-btn btn-everyone" data-answer="tutti">Tutti</button>
                <button id="btn-someone" class="btn answer-btn btn-someone" data-answer="qualcuno">Qualcuno</button>
                <button id="btn-no-one" class="btn answer-btn btn-no-one" data-answer="nessuno">Nessuno</button>
            </div>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="game-screen">
            <h2 id="gameOverTitle">Partita Finita!</h2>
            <div class="result-summary">
                <p id="result-message" class="result-message"></p>
                <div id="result-stats" class="result-stats"></div>
            </div>
            <div class="info-card">
                <p id="gameOverText">Speriamo vi siate divertiti (e abbiate bevuto abbastanza)!</p>
            </div>
            <button id="play-again" class="btn primary-btn"><span id="playAgainText">Gioca di Nuovo</span></button>
            <button id="home-btn" class="btn secondary-btn" onclick="window.location.href='../'"><span
                    id="backToHomeText">Torna alla Home</span></button>
        </div>
    </div>

    <script src="../lang.js"></script>
    <script src="translations.js"></script>
    <script src="scripts.js"></script>
</body>

</html>
